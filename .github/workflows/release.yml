name: Build desktop installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            suffix: -setup.exe
            name: windows-x64
            native_test: true
          - runner: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            suffix: .dmg
            name: macos-arm64
            native_test: true
          - runner: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            suffix: .dmg
            name: macos-x64
            native_test: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: node --test reference/earnings.test.mjs
      - run: npm run build
      - if: matrix.native_test
        run: npx playwright install chromium
      - if: matrix.native_test
        run: npm run test:ui
      - if: matrix.native_test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build installer
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - name: Stage release asset
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          BUNDLE: ${{ matrix.bundle }}
          SUFFIX: ${{ matrix.suffix }}
          PLATFORM: ${{ matrix.name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match package.json version v$version"
          }
          $path = "src-tauri/target/$env:TARGET/release/bundle/$env:BUNDLE"
          $files = @(Get-ChildItem $path -File | Where-Object { $_.Name.EndsWith($env:SUFFIX) })
          if ($files.Count -ne 1) { throw "Expected one installer in $path, got $($files.Count)" }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item -LiteralPath $files[0].FullName -Destination "release-assets/ShangBan-v$version-$env:PLATFORM$env:SUFFIX"
      - name: Verify Windows installer and upgrade path
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release-assets/*-setup.exe).FullName
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          $signer = $signature.SignerCertificate
          $os = Get-CimInstance Win32_OperatingSystem
          $details = [ordered]@{
            file = Split-Path $installer -Leaf
            sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLower()
            commit = $env:GITHUB_SHA
            windows = "$($os.Caption) $($os.Version) (build $($os.BuildNumber))"
            status = $signature.Status.ToString()
            signerCertificate = if ($signer) { $signer.Subject } else { $null }
            signerThumbprint = if ($signer) { $signer.Thumbprint } else { $null }
            timestampCertificate = if ($signature.TimeStamperCertificate) { $signature.TimeStamperCertificate.Subject } else { $null }
            malwareScan = 'Not run'
            smartScreen = 'Not exercised by silent install'
          }
          $details | ConvertTo-Json | Tee-Object -FilePath release-assets/windows-verification.json
          $installDir = Join-Path $env:RUNNER_TEMP "ShangBan-Smoke"
          $app = Join-Path $installDir "shang-ban-gu-li-qi.exe"
          $uninstaller = Join-Path $installDir "uninstall.exe"
          $bundle = Join-Path $env:LOCALAPPDATA "com.shangbanguliqi.desktop"
          if (Test-Path -LiteralPath $bundle) { throw "Expected clean test data directory on runner" }
          New-Item -ItemType Directory -Path $bundle | Out-Null
          $fixture = Join-Path $bundle "installer-ci-fixture.txt"
          Set-Content -LiteralPath $fixture -Value "synthetic test fixture"
          foreach ($attempt in 1..2) {
            $p = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
            if ($p.ExitCode -ne 0 -or !(Test-Path -LiteralPath $app) -or !(Test-Path -LiteralPath $uninstaller) -or !(Test-Path -LiteralPath $fixture)) {
              throw "Install or reinstall attempt $attempt failed with exit code $($p.ExitCode)"
            }
          }
          $p = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path -LiteralPath $app) -or !(Test-Path -LiteralPath $fixture)) {
            throw "Uninstall failed or modified test data (exit code $($p.ExitCode))"
          }
          # Prepare a disposable installed copy for the interactive evidence step.
          $p = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "UI fixture installation failed" }
      - name: Test installed Windows app and process restart
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'ShangBan-Smoke/shang-ban-gu-li-qi.exe'
          node tests/windows-installed-app.mjs "$app" "windows-ui"
      - name: Capture Windows NSIS UI evidence
        if: matrix.name == 'windows-x64'
        continue-on-error: true
        shell: powershell
        run: |
          $installer = (Get-ChildItem release-assets/*-setup.exe).FullName
          ./.github/scripts/windows-installer-ui.ps1 -Installer $installer -InstallDir "$env:RUNNER_TEMP/ShangBan-Smoke" -EvidenceDir "windows-ui"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.name == 'windows-x64'
        with:
          name: windows-native-ui-evidence
          path: windows-ui/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  draft:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Create draft after all builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release-assets
          assets=("ShangBan-$TAG-windows-x64-setup.exe" "ShangBan-$TAG-macos-arm64.dmg" "ShangBan-$TAG-macos-x64.dmg")
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          if gh release view "$TAG" --json isDraft --jq .isDraft > ../draft-status; then
            test "$(cat ../draft-status)" = true
            gh release upload "$TAG" "${assets[@]}" SHA256SUMS.txt windows-verification.json --clobber
          else
            gh release create "$TAG" --verify-tag --draft --title "上班鼓励器 $TAG" \
              --notes "含 Windows x64 NSIS 与 macOS Apple Silicon／Intel 安装包。macOS 使用临时签名，未做 Apple 公证。Windows 安装包是未签名测试版，SmartScreen 可能提示未知发布者。下载后可核对 SHA-256；公开前须完成双端实机验收。" \
              "${assets[@]}" SHA256SUMS.txt windows-verification.json
          fi
